        .range-split { color: #94a3b8; font-weight: bold; font-size: 14px; }
        .btn-setting { background-color: #475569; color: white; border: none; padding: 5px 10px; font-size: 12px; border-radius: 8px; cursor: pointer; font-weight: 700; margin-top: 0; width: auto; }

        input[type="text"]:focus { border-color: #4f46e5; background-color: #ffffff; box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.08); }

</div>

        { id: 170, eng: "sensitive", kor: ["민감한"] },
        { id: 171, eng: "sequence", kor: ["순서"] },
        { id: 172, eng: "sharp", kor: ["강한", "맛이나 향이 강한"] },
        { id: 173, eng: "sort", kor: ["분류하다"] },
        { id: 174, eng: "spatially", kor: ["공간적으로"] },
        { id: 175, eng: "spectacle", kor: ["구경거리"] },
        { id: 176, eng: "standardize", kor: ["표준화하다"] },
        { id: 177, eng: "starve", kor: ["굶주리다"] },
        { id: 178, eng: "straightforward", kor: ["단순명료한", "간단한"] },
        { id: 179, eng: "strike up", kor: ["시작하다"] },
        { id: 180, eng: "subjective", kor: ["주관적인"] },
        { id: 181, eng: "substantially", kor: ["크게", "상당히"] },
        { id: 182, eng: "subtle", kor: ["미묘한"] },
        { id: 183, eng: "supplementary", kor: ["보충적인"] },
        { id: 184, eng: "suspicion", kor: ["의심"] },
        { id: 185, eng: "sustainable", kor: ["지속 가능한"] },
        { id: 186, eng: "take ~ for granted", kor: ["~을 당연시하다"] },
        { id: 187, eng: "take place", kor: ["일어나다", "열리다"] },
        { id: 188, eng: "take up", kor: ["~을 다루다"] },
        { id: 189, eng: "transferable", kor: ["적용 가능한"] },
        { id: 190, eng: "translate", kor: ["번역하다"] },
        { id: 191, eng: "trigger", kor: ["유발하다"] },
        { id: 192, eng: "ultimately", kor: ["궁극적으로"] },
        { id: 193, eng: "unjustified", kor: ["정당하지 않은"] },
        { id: 194, eng: "unpredictable", kor: ["예측 불가능한"] },
        { id: 195, eng: "unsatisfactory", kor: ["만족스럽지 못한"] },
        { id: 196, eng: "utility", kor: ["공공 에너지 서비스", "유틸리티"] },
        { id: 197, eng: "verified", kor: ["검증된"] },
        { id: 198, eng: "vulnerability", kor: ["취약성"] },
        { id: 199, eng: "wander", kor: ["돌아다니다", "배회하다"] },
        { id: 200, eng: "yield to", kor: ["~으로 대체되다"] }
    ];

    let currentRangeList = [...masterWordList];
    let quizList = [], wrongList = [], correctedList = [], currentIndex = 0, isAnswerChecked = false;
    let isWrongReviewMode = false; 
    
    const STORAGE_KEY = "voca_wrong_list_global";

    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function getSavedWrongList() {
        let saved = localStorage.getItem(STORAGE_KEY);
        if (!saved) {
            for (let i = 0; i < localStorage.length; i++) {
                let key = localStorage.key(i);
                if (key.startsWith("voca_wrong_list_")) {
                    saved = localStorage.getItem(key);
                    break;
                }
            }
        }
        if (!saved) return [];
        try { return JSON.parse(saved); } catch(e) { return []; }
    }

    function updateGlobalWrongBtnCount() {
        const count = getSavedWrongList().length;
        const btn = document.getElementById("global-wrong-btn");
        if (btn) btn.innerText = `📂 오답노트 (${count})`;
    }

    function openWrongListScreen() {
        let savedList = getSavedWrongList();
        savedList.sort((a, b) => a.id - b.id);

        const tbody = document.getElementById("wrong-table-body");
        tbody.innerHTML = "";

        if (savedList.length === 0) {
            tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:#64748b; padding:20px; font-weight:600;">저장된 오답이 없습니다. 완벽해요! 🎉</td></tr>`;
        } else {
            savedList.forEach(item => {
                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td style="font-weight:700; color:#475569;">${item.id}</td>
                    <td class="td-word">${item.eng}</td>
                    <td style="font-weight:500;">${item.kor.join(', ')}</td>
                    <td style="text-align:center;">
                        <button class="btn-delete-item" onclick="deleteWrongItem(${item.id})">삭제</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        document.getElementById("quiz-content").style.display = "none";
        document.getElementById("wrong-list-section").style.display = "block";
    }

    function deleteWrongItem(id) {
        let savedList = getSavedWrongList();
        savedList = savedList.filter(item => item.id !== id);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(savedList));
        
        updateGlobalWrongBtnCount();
        openWrongListScreen();
    }

    function closeWrongListScreen() {
        document.getElementById("wrong-list-section").style.display = "none";
        document.getElementById("quiz-content").style.display = "block";
        if (currentIndex >= quizList.length) { initQuiz(); }
    }

    function applyRange() {
        let start = parseInt(document.getElementById("start-num").value) || 1;
        let end = parseInt(document.getElementById("end-num").value) || 200;

        if (start > end) { alert("시작 번호가 끝 번호보다 클 수 없습니다."); return; }
        if (start < 1) start = 1;
        if (end > 200) end = 200;

        currentRangeList = masterWordList.filter(item => item.id >= start && item.id <= end);
        document.getElementById("mode-display").innerText = `일반 모드 (${start}~${end}번)`;
        isWrongReviewMode = false;
        initQuiz();
    }

    function initQuiz() {
        quizList = shuffle([...currentRangeList]); 
        wrongList = []; 
        correctedList = [];
        currentIndex = 0;
        document.getElementById("clean-wrong-btn").style.display = "none"; 
        updateGlobalWrongBtnCount();
        showQuestion();
    }

    function startGlobalWrongQuiz() {
        let savedList = getSavedWrongList();
        if (savedList.length === 0) { alert("저장된 누적 오답이 없습니다!"); return; }

        quizList = shuffle([...savedList]);
        wrongList = [];
        correctedList = [];
        currentIndex = 0;
        isWrongReviewMode = true; 
        
        document.getElementById("mode-display").innerText = `🔥 누적 오답 복습 (${savedList.length}개)`;
        document.getElementById("wrong-list-section").style.display = "none";
        document.getElementById("quiz-content").style.display = "block";
        document.getElementById("clean-wrong-btn").style.display = "none"; 

        const userInput = document.getElementById("user-input");
        userInput.style.display = "inline-block";
        userInput.value = "";
        document.getElementById("result-display").style.display = "none";
        
        showQuestion();
    }

    function showQuestion() {
        const resultDiv = document.getElementById("result-display");
        const userInput = document.getElementById("user-input");
        const cleanBtn = document.getElementById("clean-wrong-btn");
        
        if (currentIndex >= quizList.length) {
            userInput.style.display = "none";
            document.getElementById("action-btn").innerText = "다시 시작하기";
            resultDiv.style.display = "block";
            updateGlobalWrongBtnCount();

            if (isWrongReviewMode) {
                document.getElementById("word-display").innerText = "🏁 복습 완료!";
                resultDiv.className = "result correct";
                
                if (correctedList.length > 0) {
                    resultDiv.innerHTML = `총 <b>${quizList.length}문제 중 ${correctedList.length}문제</b>를 맞췄습니다!<br><br>방금 맞춘 단어들을 오답노트에서 완전히 빼고 싶다면 아래 버튼을 눌러주세요.`;
                    cleanBtn.innerText = `✨ 방금 맞춘 ${correctedList.length}개 오답노트에서 빼기`;
                    cleanBtn.style.display = "inline-block";
                } else {
                    resultDiv.innerHTML = "맞춘 문제가 없습니다. 다시 한번 차근차근 복습해 보아요! 💪";
                    cleanBtn.style.display = "none";
                }
            } else {
                cleanBtn.style.display = "none";
                if (wrongList.length > 0) {
                    document.getElementById("word-display").innerText = "💾 오답 자동 저장 완료";
                    resultDiv.innerHTML = `이번 판에서 틀린 단어 <b>${wrongList.length}개</b>가 오답노트에 추가되었습니다.<br><br>우측 상단 [오답노트] 버튼을 눌러 목록을 확인하세요.`;
                    resultDiv.className = "result incorrect";
                } else {
                    document.getElementById("word-display").innerText = "🎉 범위 마스터!";
                    resultDiv.innerHTML = "해당 구간의 틀린 단어가 없습니다. 완벽해요! 🔥";
                    resultDiv.className = "result correct";
                }
            }
            return;
        }
        
        document.getElementById("word-display").innerText = quizList[currentIndex].eng;
        userInput.value = "";
        userInput.style.display = "inline-block";
        resultDiv.style.display = "none";
        cleanBtn.style.display = "none";
        document.getElementById("action-btn").innerText = "정답 확인";
        document.getElementById("score-display").innerText = `진행도: ${currentIndex} / ${quizList.length}`;
        isAnswerChecked = false;
        
        setTimeout(() => { userInput.focus(); }, 50);
    }

    function checkAnswer() {
        if (currentIndex >= quizList.length) { 
            if (isWrongReviewMode) { startGlobalWrongQuiz(); } else { initQuiz(); }
            return; 
        }
        const btn = document.getElementById("action-btn");
        const resultDiv = document.getElementById("result-display");

        if (!isAnswerChecked) {
            const uInput = document.getElementById("user-input").value.trim();
            const correctAnswers = quizList[currentIndex].kor;
            
            const cleanString = str => str.replace(/[\s\~\=\-\_\[\]\(\)\,\.\?]/g, '');
            const cleanInput = cleanString(uInput);
            
            const isCorrect = correctAnswers.some(ans => cleanInput === cleanString(ans));

            resultDiv.style.display = "block";
            if (isCorrect) {
                // ⭕ 정답 화면에서도 모든 유효 뜻을 다 같이 쉼표로 연결해서 보정 출력
                resultDiv.innerText = `⭕ 정답입니다! (${correctAnswers.join(', ')})`;
                resultDiv.className = "result correct";
                
                if (isWrongReviewMode) {
                    correctedList.push(quizList[currentIndex]);
                }
            } else {
                // ❌ 🛠️ 해결: 첫 단어 한 개만 출력되던 버그를 고치고 배열 내 모든 뜻을 join(', ')으로 통틀어 출력!
                resultDiv.innerText = `❌ 틀렸습니다.\n(정답: ${correctAnswers.join(', ')})`;
                resultDiv.className = "result incorrect";
                
                if (!isWrongReviewMode) {
                    wrongList.push(quizList[currentIndex]);
                    saveToLocalStorage(quizList[currentIndex]);
                }
            }
            btn.innerText = "다음 문제"; isAnswerChecked = true;
        } else {
            currentIndex++; showQuestion();
        }
    }

    function cleanCorrectedWrongItems() {
        if (correctedList.length === 0) return;
        
        let savedList = getSavedWrongList();
        const correctedIds = correctedList.map(item => item.id);
        
        savedList = savedList.filter(item => !correctedIds.includes(item.id));
        localStorage.setItem(STORAGE_KEY, JSON.stringify(savedList));
        
        alert(`✨ 선택하신 ${correctedList.length}개의 단어가 오답노트에서 제외되었습니다!`);
        
        correctedList = []; 
        document.getElementById("clean-wrong-btn").style.display = "none";
        updateGlobalWrongBtnCount();
        
        openWrongListScreen();
    }

    function saveToLocalStorage(wordItem) {
        let savedList = getSavedWrongList();
        if (!savedList.some(item => item.id === wordItem.id)) {
            savedList.push(wordItem);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(savedList));
            updateGlobalWrongBtnCount();
        }
    }

    function handleKeyPress(event) { if (event.key === "Enter") checkAnswer(); }

    window.onload = function() { applyRange(); };
</script>
